

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Friendship Restart.exe 🌌</title>

<style>

* { box-sizing: border-box; }

body {

  margin: 0;

  min-height: 100vh;

  overflow: hidden;

  display: grid;

  place-items: center;

  font-family: Arial, sans-serif;

  color: white;

  background: linear-gradient(180deg,#080b2b,#25205b,#a14e91);

}

.stars, .hearts {

  position: fixed;

  inset: 0;

  pointer-events: none;

  overflow: hidden;

}

.star {

  position: absolute;

  color: white;

  animation: twinkle 2s infinite alternate;

}

@keyframes twinkle {

  from { opacity: .2; transform: scale(.7); }

  to { opacity: 1; transform: scale(1.3); }

}

.card {

  position: relative;

  z-index: 2;

  width: 90%;

  max-width: 390px;

  padding: 30px 22px;

  text-align: center;

  border: 1px solid #ffffff45;

  border-radius: 25px;

  background: #ffffff13;

  backdrop-filter: blur(12px);

  box-shadow: 0 0 50px #b46bff25;

  animation: appear 1.2s ease;

}

@keyframes appear {

  from { opacity: 0; transform: translateY(25px) scale(.95); }

  to { opacity: 1; transform: translateY(0) scale(1); }

}

.icon {

  font-size: 65px;

  animation: float 2.5s ease-in-out infinite;

}

@keyframes float {

  50% { transform: translateY(-12px); }

}

h1 {

  font-size: 27px;

  line-height: 1.35;

}

p {

  color: #e7dcff;

  line-height: 1.7;

}

button {

  border: 0;

  padding: 13px 23px;

  margin-top: 15px;

  border-radius: 30px;

  color: white;

  font-size: 16px;

  font-weight: bold;

  background: linear-gradient(90deg,#d56bff,#ff75b5);

  box-shadow: 0 5px 22px #d56bff45;

  cursor: pointer;

}

button:active { transform: scale(.95); }

.bar {

  height: 12px;

  margin: 24px 0 12px;

  overflow: hidden;

  border: 1px solid #ffffff80;

  border-radius: 20px;

}

.fill {

  width: 0;

  height: 100%;

  border-radius: 20px;

  background: linear-gradient(90deg,#b76bff,#ff9ed2);

}

.heart {

  position: fixed;

  bottom: -30px;

  animation: rise 5s linear forwards;

  pointer-events: none;

}

@keyframes rise {

  to {

    transform: translateY(-110vh) rotate(35deg);

    opacity: 0;

  }

}

.small { font-size: 13px; opacity: .8; }

</style>

</head>

<body>

<div class="stars" id="stars"></div>

<div class="hearts" id="hearts"></div>

<div class="card" id="card">

  <div class="icon">🌌</div>

  <h1>Friendship Restart.exe</h1>

  <p>

    Connection lost for 4 years...<br>

    But some stories aren't over yet. ✨

  </p>

  <button id="start">Reconnect? 💫</button>

  <p class="small">A little surprise for an old friend.</p>

</div>

<script>

const stars = document.getElementById("stars");

const hearts = document.getElementById("hearts");

const card = document.getElementById("card");

// Create twinkling stars

for (let i = 0; i < 65; i++) {

  const s = document.createElement("span");

  s.className = "star";

  s.textContent = "✦";

  s.style.left = Math.random() * 100 + "%";

  s.style.top = Math.random() * 100 + "%";

  s.style.fontSize = (Math.random() * 12 + 5) + "px";

  s.style.animationDelay = Math.random() * 3 + "s";

  stars.appendChild(s);

}

// Floating hearts

function makeHeart() {

  const h = document.createElement("span");

  h.className = "heart";

  h.textContent = ["💗","✨","💕","💫"][Math.floor(Math.random()*4)];

  h.style.left = Math.random() * 100 + "%";

  h.style.fontSize = (Math.random() * 18 + 15) + "px";

  h.style.animationDuration = (Math.random() * 3 + 4) + "s";

  hearts.appendChild(h);

  setTimeout(() => h.remove(), 7000);

}

document.getElementById("start").addEventListener("click", () => {

  card.innerHTML = `

    <div class="icon">🔄</div>

    <h1>Reconnecting...</h1>

    <p id="status">Searching old memories ✨</p>

    <div class="bar"><div class="fill" id="fill"></div></div>

    <p id="percent">0%</p>

  `;

  const fill = document.getElementById("fill");

  const percent = document.getElementById("percent");

  const status = document.getElementById("status");

  let progress = 0;

  const timer = setInterval(() => {

    progress += 1;

    fill.style.width = progress + "%";

    percent.textContent = progress + "%";

    if (progress === 30) status.textContent = "Finding old memories...";

    if (progress === 65) status.textContent = "Restoring friendship...";

    if (progress >= 100) {

      clearInterval(timer);

      card.innerHTML = `

        <div class="icon">💖</div>

        <h1>Connection Restored!</h1>

        <p>

          Four years passed...<br>

          And somehow, we're talking again. 🥹

        </p>

        <p>

          Some people disappear from our daily lives,

          but their memories stay.

        </p>

        <h3>Welcome back, old friend. 🌷</h3>

        <button id="again">Replay ✨</button>

        <p class="small">Made with a little nostalgia 💗</p>

      `;

      for (let i = 0; i < 12; i++) {

        setTimeout(makeHeart, i * 180);

      }

      document.getElementById("again").onclick = () => location.reload();

    }

  }, 45);

});

setInterval(makeHeart, 1500);

</script>

</body>

</html>
